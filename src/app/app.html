<div class="min-h-screen bg-slate-50 pb-20 text-slate-900 md:pb-0">
  <header class="border border-slate-200 bg-white m-5 rounded-full shadow-md mx-10">
    <div class="flex items-center justify-between px-5 py-4 md:mx-3">
      <div class="flex gap-10 items-center">
        <a
          routerLink="/"
          z
          class="flex items-center gap-2 font-semibold tracking-tight text-lg"
          aria-label="Codamon, accueil"
        >
          <span>Codamon</span>
        </a>

        <nav
          #nav
          class="relative hidden items-center p-1 gap-2 md:flex bg-[#EFEEEB] rounded-full"
          aria-label="Navigation principale"
        >
          <span
            class="absolute top-1 bottom-1 rounded-full bg-stone-300 transition-all duration-300 ease-out"
            [style.left.px]="pill().left"
            [style.width.px]="pill().width"
            [class.opacity-0]="!pill().ready"
            aria-hidden="true"
          ></span>

          <a
            routerLink="/"
            routerLinkActive
            #rla1="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            (isActiveChange)="onActiveChange($event, $any(l1))"
            #l1
            class="relative z-10 rounded-full px-4 py-2 text-sm font-medium text-[#45474A] transition"
            [class.text-black]="rla1.isActive"
          >
            Dashboard
          </a>

          <a
            routerLink="/pack"
            routerLinkActive
            #rla2="routerLinkActive"
            ariaCurrentWhenActive="page"
            (isActiveChange)="onActiveChange($event, $any(l2))"
            #l2
            class="relative z-10 rounded-full px-4 py-2 text-sm font-medium text-[#45474A] transition"
            [class.text-black]="rla2.isActive"
          >
            Packs
          </a>

          <a
            routerLink="/test-carte"
            routerLinkActive
            #rla3="routerLinkActive"
            ariaCurrentWhenActive="page"
            (isActiveChange)="onActiveChange($event, $any(l3))"
            #l3
            class="relative z-10 rounded-full px-4 py-2 text-sm font-medium text-[#45474A] transition"
            [class.text-black]="rla3.isActive"
          >
            Test carte
          </a>
        </nav>
      </div>

      <a
        routerLink="/account"
        class="max-w-36 truncate rounded-full bg-[#EFEEEB] px-3 py-1.5 text-xs font-medium text-slate-600 sm:max-w-56"
      >
        {{ initialized() ? (user()?.email ?? 'Mon compte') : 'Chargement…' }}
      </a>
    </div>
  </header>

  <main>
    <router-outlet />
  </main>
</div>
