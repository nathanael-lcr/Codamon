<main class="mx-auto max-w-md space-y-6 p-6">
  <header class="space-y-2">
    <h1 class="text-2xl font-bold">Test Supabase Auth</h1>
    <p class="text-sm text-gray-500">Vérifie la connexion et teste l'authentification.</p>
  </header>

  <section class="space-y-3 rounded-xl border p-4">
    <h2 class="font-semibold">État de la connexion</h2>

    <p aria-live="polite" class="text-sm">
      {{ status }}
    </p>

    <button
      type="button"
      class="w-full rounded-lg border px-4 py-2 transition hover:bg-gray-100 disabled:opacity-50"
      [disabled]="loading"
      (click)="testConnection()"
    >
      Tester la connexion
    </button>

    @if (authenticated) {
      <p class="text-sm">
        Connecté en tant que
        <strong>{{ currentEmail }}</strong>
      </p>
    }
  </section>

  <section class="space-y-4 rounded-xl border p-4">
    <h2 class="font-semibold">Authentification</h2>

    <div class="space-y-1">
      <label for="email" class="text-sm font-medium"> Adresse e-mail </label>

      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
        class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="toi@exemple.fr"
        [(ngModel)]="email"
      />
    </div>

    <div class="space-y-1">
      <label for="password" class="text-sm font-medium"> Mot de passe </label>

      <input
        id="password"
        name="password"
        type="password"
        [autocomplete]="authenticated ? 'current-password' : 'new-password'"
        required
        class="w-full rounded-lg border px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Ton mot de passe"
        [(ngModel)]="password"
      />
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button
        type="button"
        class="rounded-lg bg-blue-600 px-4 py-2 text-white transition hover:bg-blue-700 disabled:opacity-50"
        [disabled]="loading || !email || !password"
        (click)="signUp()"
      >
        S'inscrire
      </button>

      <button
        type="button"
        class="rounded-lg bg-green-600 px-4 py-2 text-white transition hover:bg-green-700 disabled:opacity-50"
        [disabled]="loading || !email || !password"
        (click)="signIn()"
      >
        Se connecter
      </button>
    </div>

    @if (authenticated) {
      <button
        type="button"
        class="w-full rounded-lg border px-4 py-2 transition hover:bg-gray-100 disabled:opacity-50"
        [disabled]="loading"
        (click)="signOut()"
      >
        Se déconnecter
      </button>
    }

    @if (loading) {
      <p class="text-center text-sm text-gray-500">Opération en cours…</p>
    }
  </section>
</main>
